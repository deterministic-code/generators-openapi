version: 1.0.0
types:
  - role:
      tags: [datasource_type, view_type]
      inherits: set
      fields:
        - name:
            type: string
  - user:
      tags: [datasource_type, view_type]
      inherits: set
      fields:
        - email:
            type: string
            size: 256
        - role_id:
            type: number
            references: role.id
        - nick_name:
            type: string
            is_nullable: true
